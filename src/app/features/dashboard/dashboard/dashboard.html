<div class="row g-3 mb-4">
  <div class="col-12">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-2">Dashboard MarketFlow</h1>

        @if (currentUser$ | async; as user) {
          <p class="text-muted mb-0">
            Bienvenido, <strong>{{ user.username }}</strong>.
            Roles: <strong>{{ user.roles.join(', ') }}</strong>
          </p>
        }
      </div>
    </div>
  </div>
</div>

<div class="row g-3">
  <div class="col-12 col-md-4">
    <div class="card border-0 shadow-sm">
      <div class="card-body">
        <div class="text-muted small">Ventas</div>
        <div class="h4 mb-0">Pendiente</div>
      </div>
    </div>
  </div>

  <div class="col-12 col-md-4">
    <div class="card border-0 shadow-sm">
      <div class="card-body">
        <div class="text-muted small">Productos bajo stock</div>
        <div class="h4 mb-0">Pendiente</div>
      </div>
    </div>
  </div>

  <div class="col-12 col-md-4">
    <div class="card border-0 shadow-sm">
      <div class="card-body">
        <div class="text-muted small">Movimientos</div>
        <div class="h4 mb-0">Pendiente</div>
      </div>
    </div>
  </div>
</div>

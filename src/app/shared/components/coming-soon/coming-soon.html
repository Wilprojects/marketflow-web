@if (routeData$ | async; as data) {
  <div class="card border-0 shadow-sm">
    <div class="card-body p-4">
      <h1 class="h4 mb-2">
        {{ data['title'] || 'Módulo' }}
      </h1>

      <p class="text-muted mb-4">
        {{ data['description'] || 'Este módulo se desarrollará próximamente.' }}
      </p>

      <div class="alert alert-info mb-0">
        Esta pantalla es temporal. Luego será reemplazada por el módulo real.
      </div>
    </div>
  </div>
}
